# Local proxy that lets Claude Router talk to Groq's free tier.
# Start:  GROQ_API_KEY=gsk_... scripts/start-proxy.sh
#
# Every model id in resources/models-registry.json is listed, so the router's
# "latest" resolution, pinned snapshots and /family-version prefixes all work.
# Haiku versions map to the small GPT-OSS model, every other family to the large
# one. The status bar shows the Claude tier the router chose; a Groq model answers.
model_list:
  # fable
  - model_name: claude-fable-5-1
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-fable-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  # opus
  - model_name: claude-opus-5-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-opus-4-8
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-opus-4-7
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-opus-4-6
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-opus-4-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  # sonnet
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  # haiku
  - model_name: claude-haiku-5-5
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  # Passthrough: call any Groq model by its own name, e.g. groq/openai/gpt-oss-20b,
  # from the Custom Model ID channel, or to check which names Groq still serves.
  - model_name: groq/*
    litellm_params:
      model: groq/*
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  # Must match the key stored via "Claude Router: Set Anthropic API Key". Local-only; not a real secret.
  master_key: sk-local-proxy
